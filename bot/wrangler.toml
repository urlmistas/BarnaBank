name = "barnabank-bot"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

# o ID é preenchido sozinho pelo GitHub Actions (.github/workflows/bot.yml)
[[kv_namespaces]]
binding = "BB"
id = "__KV_ID__"

# login das contas: o app manda o token do Supabase e o bot confere lá (chave publicável, não é segredo)
[vars]
SB_URL = "https://epsddfqunjqopylrbbyv.supabase.co"
SB_KEY = "sb_publishable_W04BorQgNFQ2TMGxnaRYow_EwuzV5Ni"

# de hora em hora: às 9h (Brasília) o bot faz backup e contas recorrentes; os lembretes saem na hora que cada conta escolheu
[triggers]
crons = ["0 * * * *"]

# Workers AI: entender áudio e responder perguntas livres (opcional; se não der, o bot funciona sem)
[ai]
binding = "AI"
