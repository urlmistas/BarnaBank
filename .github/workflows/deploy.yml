# Publica no GitHub Pages. Só roda depois que existir um repositório remoto com
# Pages configurado para "GitHub Actions" (Settings → Pages → Source).
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:bot
      - run: npm run build
        env:
          # bot compartilhado: Settings > Secrets and variables > Actions > Variables > BOT_URL (https://barnabank-bot.<sub>.workers.dev)
          VITE_BOT_URL: ${{ vars.BOT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
